name: Build Stock/Plain Kernel Cepheus

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        repository: JoK3rLeE/android_kernel_xiaomi_sm8150
        ref: 17.0-cepheus
        fetch-depth: 1

    - name: Install toolchain (Clang 21 / r563880c - PERSIS sama kayak kernel yang lagi jalan di device)
      run: |
          sudo apt update
          sudo apt install -y bc bison flex libssl-dev libelf-dev build-essential gcc-aarch64-linux-gnu

          echo "=== Download clang-r563880c (AOSP resmi, cocok sama build string kernel yang jalan) via sparse git clone di commit spesifik ==="
          mkdir -p toolchain
          git clone --filter=blob:none --sparse --no-checkout https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 clang_repo
          cd clang_repo
          git fetch --depth=1 origin f8439f0628d799092dd07df440a6334cab28939c
          git checkout FETCH_HEAD
          git sparse-checkout set clang-r563880c
          cd ..
          ls clang_repo/
          mv clang_repo/clang-r563880c toolchain/clang
          rm -rf clang_repo

          echo "=== Verifikasi ==="
          toolchain/clang/bin/clang --version

          echo "TOOLCHAIN_CLANG=$PWD/toolchain/clang/bin" >> "$GITHUB_ENV"

          # Pindahkan folder clang-r563880c
          mkdir clang
          cp -r android-clang/clang-r563880c/* clang/
          rm -rf android-clang
   
    - name: Build Kernel
      run: |
        export PATH="$GITHUB_WORKSPACE/toolchains/clang/bin:$GITHUB_WORKSPACE/toolchains/gcc64/bin:$GITHUB_WORKSPACE/toolchains/gcc32/bin:$PATH"
        export ARCH=arm64
                 
          # LLVM toolchain
          export LLVM=1
          export LLVM_IAS=1
          
          export CC=clang
          export CXX=clang++
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          
          # Cross compiler compatibility
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          echo "=== Compiler verification ==="
          "${CC}" --version
          "${LD}" --version
          "${AR}" --version
          
          echo "=== Build config ==="
          echo "CC=${CC}"
          echo "LD=${LD}"
          echo "AR=${AR}"
          echo "NM=${NM}"
          echo "LLVM=${LLVM}"
          echo "LLVM_IAS=${LLVM_IAS}"
          echo "CROSS_COMPILE=${CROSS_COMPILE}"
          
          make O=out ARCH=arm64 olddefconfig
          
          make ARCH=arm64 \
               O=out \
               CC="${CC}" \
               AR="${AR}" \
               LD="${LD}" \
               NM="${NM}" \
               OBJCOPY="${OBJCOPY}" \
               OBJDUMP="${OBJDUMP}" \
               STRIP="${STRIP}" \
               CROSS_COMPILE="${CROSS_COMPILE}" \
               CROSS_COMPILE_ARM32="${CROSS_COMPILE_ARM32}" \
               LLVM=1 \
               LLVM_IAS=1 \
               -j"$(nproc --all)" \
               Image.gz-dtb
        
          ls out/arch/arm64/boot/Image.gz-dtb
          ls out/arch/arm64/boot/Image
    
    - name: Check Build Output
      run: |
        if [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
          echo "IMAGE_TYPE=Image.gz-dtb" >> $GITHUB_ENV
        elif [ -f "out/arch/arm64/boot/Image.gz" ]; then
          echo "IMAGE_TYPE=Image.gz" >> $GITHUB_ENV
        elif [ -f "out/arch/arm64/boot/Image" ]; then
          echo "IMAGE_TYPE=Image" >> $GITHUB_ENV
        else
          echo "Kernel image tidak ditemukan! Kompilasi gagal."
          exit 1
        fi

    - name: Package AnyKernel3
      run: |
        git clone https://github.com/osm0sis/AnyKernel3 --depth=1
         cp anykernel.sh AnyKernel3/anykernel.sh
         cp ak3-core.sh AnyKernel3/tools/ak3-core.sh
         cat AnyKernel3/anykernel.sh
         cp kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
         cp kernel/out/arch/arm64/boot/Image kernel-pure.img
         cd AnyKernel3 && zip -r9 ../cepheus-kernel-plain.zip * -x README

    - name: Upload Kernel Artifact
      uses: actions/upload-artifact@v4
      with:
        name: cepheus-kernel-plain
        path: cepheus-kernel-plain.zip
