name: Build Kernel Cepheus A16 Crdroid

on:
  workflow_dispatch:

env:
  KERNEL_SOURCE: "https://github.com/crdroidandroid/android_kernel_xiaomi_sm8150"
  KERNEL_BRANCH: "16.0"
  BASE_DEFCONFIG: "arch/arm64/configs/vendor/sm8150-perf_defconfig"
  DEVICE_FRAGMENT: "arch/arm64/configs/vendor/xiaomi/cepheus.config"
  KERNEL_ARCH: "arm64"

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout Kernel Sendiri
      uses: actions/checkout@v4
           
    - name: Clone kernel source (ikut update branch)
      run: |
          git clone --depth=1 -b "${{ env.KERNEL_BRANCH }}" "${{ env.KERNEL_SOURCE }}" kernel   
    
    - name: Ganti file logika dtc punya Jokerlee
      working-directory: kernel
      run: |
          rm -rf /tmp/dtc16
          git clone --depth=1 -b 16.0-cepheus "https://github.com/JoK3rLeE/android_kernel_xiaomi_sm8150" /tmp/dtc16
          for f in checks.c dtc-lexer.l dtc-lexer.lex.c_shipped dtc-parser.tab.c_shipped dtc-parser.y dtc.c dtc.h flattree.c livetree.c srcpos.c srcpos.h util.h; do
            cp "/tmp/dtc16/scripts/dtc/$f" "scripts/dtc/$f"
          done
          rm -rf /tmp/dtc16 
    
    - name: Install toolchain (Clang 21 / r563880c - PERSIS sama kayak kernel yang lagi jalan di device)
      run: |
          sudo apt update
          sudo apt install -y bc bison flex libssl-dev libelf-dev build-essential gcc-aarch64-linux-gnu

          echo "=== Download clang-r563880c (AOSP resmi, cocok sama build string kernel yang jalan) via sparse git clone di commit spesifik ==="
          mkdir -p toolchain
          git clone --filter=blob:none --sparse --no-checkout https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 clang_repo
          cd clang_repo
          git fetch --depth=1 origin f8439f0628d799092dd07df440a6334cab28939c
          git checkout FETCH_HEAD
          git sparse-checkout set clang-r563880c
          cd ..
          ls clang_repo/
          mv clang_repo/clang-r563880c toolchain/clang
          rm -rf clang_repo

          echo "=== Verifikasi ==="
          toolchain/clang/bin/clang --version

          echo "TOOLCHAIN_CLANG=$PWD/toolchain/clang/bin" >> "$GITHUB_ENV" 
    
    - name: Merge defconfig (persis seperti ROM)
      working-directory: kernel
      run: |
          export ARCH=arm64
          mkdir -p out
          scripts/kconfig/merge_config.sh -O out \
            arch/arm64/configs/vendor/sm8150-perf_defconfig \
            arch/arm64/configs/vendor/xiaomi/sm8150-common.config \
            arch/arm64/configs/vendor/xiaomi/cepheus.config
          make O=out ARCH=arm64 olddefconfig
          grep -E "^CONFIG_(KSU|KSU_MANUAL_HOOK|KSU_SUSFS|INITRAMFS_IGNORE_SKIP_FLAG|EROFS_FS|QCA_CLD_WLAN|LTO_NONE)=|^CONFIG_CMDLINE=" out/.config
    
    - name: Update localversion
      working-directory: kernel
      run: |
          sed -i 's/CONFIG_LOCALVERSION=".*"/CONFIG_LOCALVERSION="-QUICK"/' out/.config
          grep "CONFIG_LOCALVERSION" out/.config
    
    - name: Clone AnyKernel3
      run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3
          echo "=== Ganti anykernel.sh & ak3-core.sh bawaan (generic, buat OMAP/tuna) dengan punya InfiniR (proven working buat cepheus) ==="
          cp anykernel.sh AnyKernel3/anykernel.sh
          cp ak3-core.sh AnyKernel3/tools/ak3-core.sh
          cat AnyKernel3/anykernel.sh
    
    - name: Set up Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 10

    - name: Verifikasi swap
      run: |
          swapon --show
          free -h

    - name: Ganti ke ThinLTO
      working-directory: kernel
      run: |
          scripts/config --file out/.config \
            -d LTO_NONE \
            -e LTO_CLANG \
            -e THINLTO
          make O=out ARCH=arm64 olddefconfig
          grep -E "^CONFIG_(LTO|THINLTO)" out/.config

    - name: Aktifkan SDCARD_FS
      working-directory: kernel
      run: |
          scripts/config --file out/.config -e SDCARD_FS
          make O=out ARCH=arm64 olddefconfig
          grep SDCARD_FS out/.config

    - name: Fix TAS2557 reset GPIO
      working-directory: kernel
      run: |
          sed -i 's|//ti,cdc-reset-gpio|ti,cdc-reset-gpio|' \
            arch/arm64/boot/dts/qcom/xiaomi/overlay/cepheus/cepheus-sm8150.dtsi
          grep -n "cdc-reset-gpio" \
            arch/arm64/boot/dts/qcom/xiaomi/overlay/cepheus/cepheus-sm8150.dtsi
    
    - name: Build kernel
      working-directory: kernel
      run: |
          export PATH="$TOOLCHAIN_CLANG:$PATH"
          export ARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip

          make O=out ARCH=arm64 olddefconfig
          make ARCH=arm64 O=out CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- \
               LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
               -j2 Image.gz-dtb cepheus-sm8150-overlay.dtbo

          ls out/arch/arm64/boot/Image.gz-dtb
          ls out/arch/arm64/boot/Image
          find out/arch/arm64/boot/dts -iname "*.dtbo"
    
    - name: Cek OOM
      if: always()
      run: sudo dmesg | grep -iE "out of memory|killed process" | tail -30

    - name: Pack AnyKernel3
      run: |
          cp kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cd AnyKernel3 && zip -r9 ../cepheus_kernel.zip * -x README

    - name: Upload hasil build (boot)
      uses: actions/upload-artifact@v4
      with:
          name: cepheus-kernel
          path: |
            cepheus_kernel.zip

    - name: Upload dtbo (flash manual via fastboot)
      uses: actions/upload-artifact@v4
      with:
          name: cepheus-dtbo
          path: |
            kernel/out/arch/arm64/boot/dts/qcom/cepheus-sm8150-overlay.dtbo
